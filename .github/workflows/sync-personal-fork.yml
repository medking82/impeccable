name: Sync Personal Fork

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-personal-fork-main
  cancel-in-progress: false

jobs:
  notice:
    if: github.repository == 'medking82/impeccable' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quiet: ${{ steps.check.outputs.quiet }}
    steps:
      - name: Check today's failure notice
        id: check
        uses: medking82/skills/.github/actions/upstream-sync-notice@main
        with:
          mode: check

  sync:
    needs: notice
    # A failed notice job must not skip the sync; it then reports normally.
    if: ${{ !cancelled() && github.repository == 'medking82/impeccable' && github.ref == 'refs/heads/main' }}
    # After the day's first failure email, a scheduled retry that fails again stays green.
    continue-on-error: ${{ needs.notice.outputs.quiet == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the personal fork
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Merge upstream without rewriting fork history
        id: sync
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/pbakaus/impeccable.git main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git merge-base HEAD FETCH_HEAD)"
          workflow_changes="$(git diff --name-only "$base" FETCH_HEAD -- .github/workflows)"
          if [ -n "$workflow_changes" ]; then
            printf 'Upstream workflow changes need review:\n%s\n' "$workflow_changes" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge --no-edit FETCH_HEAD; then
            git merge --abort
            exit 1
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Check out the pinned qualification runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: medking82/hermes-fleet-sync
          ref: 4f79a5b4452d9a91037e4cbf564a927b44e2bac6
          path: .qualification-runner
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install the release fixture's pinned Bun prerequisite
        run: |
          npm install --prefix "$RUNNER_TEMP/qualification-tools" --no-audit --no-fund bun@1.3.14
          echo "$RUNNER_TEMP/qualification-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Qualify the fork's release controls
        if: steps.sync.outputs.changed == 'true'
        run: python -B scripts/qualify-release.py --runner .qualification-runner --state "$RUNNER_TEMP/release-qualification"

      - name: Publish the merge
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          git push origin HEAD:refs/heads/main

  mark:
    needs: [notice, sync]
    if: ${{ !cancelled() && needs.sync.result == 'failure' && needs.notice.outputs.quiet != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remember today's failure notice
        uses: medking82/skills/.github/actions/upstream-sync-notice@main
        with:
          mode: mark
